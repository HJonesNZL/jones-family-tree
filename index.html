<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jones Family Tree</title><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Jones Family Tree</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an Admiralty chart. Pale sea ground, white chart paper for cards, buff "land" for the
   direct line, magenta (the chart colour for lights and notes) for selection and links. Tree is the chart;
   the detail panel is the pilot book entry for whoever is selected. */
:root{
  --sea:#E3EDF1; --sea-deep:#C9DCE4; --paper:#FBFCFA; --ink:#17232D; --ink-soft:#4C5D69; --rule:#9FB4BF;
  --land:#F1E4AE; --land-ink:#4A3F0E; --magenta:#A21C78; --magenta-soft:#F3DCEB;
  --ok:#1F6B4A; --ok-bg:#DDEFE5; --warn:#8A5A00; --warn-bg:#F6E8C8; --maybe:#6B4FA0; --maybe-bg:#E8E1F4; --fam-bg:#DDE6EB;
  --display:"Libre Caslon Text", "Iowan Old Style", Georgia, serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sea:#0E1920; --sea-deep:#16262F; --paper:#182934; --ink:#E7EEF1; --ink-soft:#A3B5BF; --rule:#3D5563;
  --land:#4B431C; --land-ink:#F0E3A6; --magenta:#EE8AC9; --magenta-soft:#3E2236;
  --ok:#8FD3B0; --ok-bg:#173A2B; --warn:#EBC46E; --warn-bg:#3D3012; --maybe:#C3B0EE; --maybe-bg:#2C2444; --fam-bg:#22343F;
  color-scheme: dark } }
:root[data-theme="dark"]{
  --sea:#0E1920; --sea-deep:#16262F; --paper:#182934; --ink:#E7EEF1; --ink-soft:#A3B5BF; --rule:#3D5563;
  --land:#4B431C; --land-ink:#F0E3A6; --magenta:#EE8AC9; --magenta-soft:#3E2236;
  --ok:#8FD3B0; --ok-bg:#173A2B; --warn:#EBC46E; --warn-bg:#3D3012; --maybe:#C3B0EE; --maybe-bg:#2C2444; --fam-bg:#22343F;
  color-scheme: dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font:15px/1.55 var(--body);display:flex;flex-direction:column}
a{color:var(--magenta)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}

.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header.top{background:var(--paper);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px;padding-block:14px 10px}
h1{font:400 clamp(22px,3.4vw,30px)/1.15 var(--display);margin:0;text-wrap:balance}
h1 em{font-style:italic}
.sub{font:12px/1.4 var(--mono);color:var(--ink-soft);letter-spacing:.02em;margin-top:4px}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:6px 12px;border:1px solid transparent;border-radius:3px;text-decoration:none;color:var(--ink-soft);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink);background:var(--sea)}
/* chart-margin graduation */
.scale{height:7px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 60px),
  repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 12px);border-bottom:1px solid var(--ink)}

main{flex:1;min-height:0;display:flex;flex-direction:column}
section.view{flex:1;min-height:0}
#tree{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);min-height:0}
#tree.nodetail{grid-template-columns:minmax(0,1fr)}
.chartcol{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--sea)}
.toolbar button{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:4px 10px;cursor:pointer;font-size:13px}
.toolbar button:hover{border-color:var(--ink)}
.toolbar select{max-width:100%;min-height:34px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:4px 8px;font:inherit}
.ancestor-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.ancestor-controls select{min-height:40px;max-width:100%;font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:4px 8px}
.ancestor-list{list-style:none;margin:0;padding:0}
.ancestor-list .ancestor-list{margin-left:.65rem;padding-left:.85rem;border-left:1px solid var(--rule)}
.ancestor-list li{margin:0 0 .6rem}
.ancestor-person{width:100%;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;text-align:left;font:inherit;cursor:pointer}
.ancestor-person:hover,.ancestor-person:focus-visible{border-color:var(--ink)}
.ancestor-person small{color:var(--ink-soft)}
.ancestor-person strong{overflow-wrap:anywhere}
.ancestors-link{background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:6px 10px;color:var(--ink);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-left:auto;font-size:12px;color:var(--ink-soft);align-items:center}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid var(--rule);vertical-align:-1px;margin-right:5px}
.legend i.l{background:var(--land)}
.legend i.u{height:0;border:0;border-top:2px solid var(--ink-soft);vertical-align:3px}
.legend i.cp{border-top-style:dashed}
.scroller{flex:1;min-height:320px;overflow:auto;cursor:grab;touch-action:none;background:
  linear-gradient(var(--sea-deep) 1px,transparent 1px) 0 0/100% 120px,
  linear-gradient(90deg,var(--sea-deep) 1px,transparent 1px) 0 0/120px 100%, var(--sea)}
.scroller.drag{cursor:grabbing;user-select:none}
.sizer{position:relative;overflow:hidden}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas svg{position:absolute;left:0;top:0;pointer-events:none}
.canvas svg path{fill:none;stroke:var(--rule);stroke-width:1.5}
.canvas svg path.line{stroke:var(--magenta);stroke-width:2.5}
.canvas svg path.union{stroke:var(--ink-soft);stroke-width:2}
.canvas svg path.coparents{stroke-dasharray:4 3}
.card{position:absolute;width:196px;background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:9px 10px 9px;text-align:left;cursor:pointer;display:flex;gap:9px;align-items:flex-start}
.card:hover{border-color:var(--ink)}
.card.line{background:var(--land);color:var(--land-ink);border-color:var(--land-ink)}
.card.sel{outline:3px solid var(--magenta);outline-offset:1px}
.card.unknown{border-style:dashed;background:transparent}
.card img{width:44px;height:54px;object-fit:cover;border:1px solid var(--rule);flex:none;filter:grayscale(.2)}
.card .t{min-width:0;display:block}
.card .n{display:block;font:italic 400 15.5px/1.2 var(--display);overflow-wrap:anywhere}
.card .d{display:block;font:11.5px/1.35 var(--mono);opacity:.85;margin-top:3px}
.card .r{display:block;font-size:12px;line-height:1.3;margin-top:4px;opacity:.9}

aside.detail{background:var(--paper);border-left:1px solid var(--rule);overflow:auto;min-height:0}
.detail .in{padding:18px 20px 40px;display:flex;flex-direction:column;gap:18px}
.detail .close{display:none}
.detail .rel{font:11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--magenta)}
.detail h2{font:italic 400 27px/1.15 var(--display);margin:4px 0 2px;text-wrap:balance}
.detail .dates{font:13px var(--mono);color:var(--ink-soft)}
.detail .head{display:flex;gap:14px;align-items:flex-start}
.detail .head img{width:104px;height:130px;object-fit:cover;border:1px solid var(--rule);cursor:zoom-in;flex:none}
.detail h3{font:600 11.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
.detail p{margin:0 0 10px;max-width:65ch}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.facts li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px}
.facts .when{font:12px/1.6 var(--mono);color:var(--ink-soft)}
.chip{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 5px;border-radius:2px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.chip.c{background:var(--ok-bg);color:var(--ok)} .chip.p{background:var(--warn-bg);color:var(--warn)}
.chip.s{background:var(--maybe-bg);color:var(--maybe)} .chip.f{background:var(--fam-bg);color:var(--ink-soft)}
sup.ref a{font:11px var(--mono);text-decoration:none;padding:0 1px}
.kin{display:flex;flex-direction:column;gap:5px;font-size:14px}
.kin b{font-weight:600;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.kin button{background:none;border:0;padding:0;color:var(--magenta);text-decoration:underline;cursor:pointer;text-align:left}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0}
figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--rule);cursor:zoom-in;display:block}
figcaption{font-size:12px;line-height:1.4;margin-top:5px}
figcaption small{display:block;color:var(--ink-soft);font-size:11px}
ol.src{margin:0;padding-left:22px;font-size:12.5px;line-height:1.45;display:flex;flex-direction:column;gap:5px;overflow-wrap:anywhere}

.page{overflow:auto;height:100%}
.page .wrap{padding-block:26px 60px;max-width:980px;margin:0 auto}
.page h2{font:400 24px/1.2 var(--display);margin:0 0 6px}
.page .lede{color:var(--ink-soft);max-width:65ch;margin:0 0 22px}
.decade{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 18px;border-top:1px solid var(--rule);padding:14px 0}
.decade>b{font:400 22px var(--display);color:var(--ink-soft)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.tl .y{font:13px/1.65 var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tl li.ctx{color:var(--ink-soft);font-style:italic}
.tl button{background:none;border:0;padding:0;font-weight:600;color:var(--magenta);cursor:pointer;text-decoration:underline;text-align:left}
.rs{display:flex;flex-direction:column;gap:30px}
.rs h3{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.rs ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;max-width:75ch}
.rs li{overflow-wrap:anywhere}
.key{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px}

.lightbox{position:fixed;inset:0;background:rgba(8,14,18,.9);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain}
.lightbox p{color:#E7EEF1;font-size:13px;max-width:70ch;text-align:center;margin:0}

@media (max-width: 860px){
  #tree{grid-template-columns:minmax(0,1fr)}
  aside.detail{position:fixed;inset:0;z-index:30;border-left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  aside.detail .in{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .detail .close{display:block;position:sticky;top:0;z-index:2;width:100%;background:var(--paper);border:0;border-bottom:1px solid var(--rule);padding:12px 16px;text-align:left;font-weight:600;cursor:pointer}
  .legend{margin-left:0;width:100%}
  .toolbar select{width:100%;font-size:16px}
  .toolbar button{min-height:38px}
  .decade{grid-template-columns:1fr}
}
/* A paper chart with a dark green ink reserved for the direct line. */
:root {
  --sea:#f1f2eb; --sea-deep:#dde2d8; --paper:#fffefa; --ink:#202c29; --ink-soft:#52645e; --rule:#b8c4b9;
  --land:#1e5146; --land-ink:#fffdf3; --direct-stroke:#296e5d; --magenta:#7d4131;
  --chart-dot:#c8d2c7; --card-shadow:0 2px 5px rgb(34 48 38 / .07);
}
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
  --sea:#152321; --sea-deep:#293a34; --paper:#202e2a; --ink:#eff3e9; --ink-soft:#afc2b7; --rule:#52685e;
  --land:#306454; --land-ink:#f8faf0; --direct-stroke:#84cbb0; --magenta:#edac92; --chart-dot:#35483f;
} }
:root[data-theme="dark"] {
  --sea:#152321; --sea-deep:#293a34; --paper:#202e2a; --ink:#eff3e9; --ink-soft:#afc2b7; --rule:#52685e;
  --land:#306454; --land-ink:#f8faf0; --direct-stroke:#84cbb0; --magenta:#edac92; --chart-dot:#35483f;
}
header.top .wrap{padding:18px clamp(16px,3vw,42px) 14px;align-items:center}
h1{font-size:clamp(22px,2.3vw,33px);letter-spacing:-.035em}
.sub{font:12px/1.5 var(--body);letter-spacing:.01em}
nav.tabs{gap:2px}
nav.tabs a{border-radius:5px;letter-spacing:0;text-transform:none;font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:transparent}
.scale{height:4px;background:var(--land);border:0}
.toolbar{padding:12px clamp(14px,2vw,26px);gap:9px 14px;background:var(--paper);align-items:flex-end}
.chart-field{display:grid;gap:3px;min-width:0;font:600 11px/1.2 var(--body);color:var(--ink-soft);letter-spacing:.04em}
.chart-field select{width:100%;height:38px;padding:0 30px 0 10px;background:var(--paper);color:var(--ink);font:500 14px var(--body);border-radius:6px;cursor:pointer}
.chart-field:first-child{flex:1 1 175px;max-width:270px}
.chart-field:nth-child(2){flex:1 1 145px;max-width:200px}
.chart-field:nth-child(3){flex:1 1 155px;max-width:245px}
.partner-toggle{display:inline-flex;align-items:center;gap:5px;min-height:38px;margin-left:auto;font:500 13px var(--body);white-space:nowrap;cursor:pointer}
.partner-toggle input{width:17px;height:17px;accent-color:var(--direct-stroke);cursor:pointer}
.chart-surface{flex:1;min-height:0;display:flex;position:relative}
.chart-empty{position:absolute;inset:0;display:grid;place-content:center;margin:0;padding:20px;text-align:center;color:var(--ink-soft);pointer-events:none}
.scroller{height:100%;min-height:0;background:radial-gradient(circle,var(--chart-dot) .75px,transparent .95px) 0 0 / 18px 18px,var(--sea)}
.canvas svg path{stroke:var(--ink-soft);stroke-width:1.35;stroke-linejoin:round;stroke-linecap:round}
.canvas svg path.line{stroke:var(--direct-stroke);stroke-width:3.75}
.canvas svg path.union{stroke-width:1.75}
.canvas svg path.coparents{stroke-dasharray:5 4}
.canvas svg path.pending{stroke:var(--magenta);stroke-dasharray:2 5}
.card{width:220px;min-height:75px;padding:12px 15px;border-radius:8px;align-items:center;box-shadow:var(--card-shadow)}
.card:hover{border-color:var(--direct-stroke);box-shadow:0 3px 9px rgb(34 48 38 / .13)}
.card.line{border-color:var(--direct-stroke)}
.card.sel{outline:2px solid var(--magenta);outline-offset:4px}
.card .n{font:400 18px/1.25 var(--display);letter-spacing:-.025em}
.card .d{font-size:12px;margin-top:5px}
.card .r{font:12px/1.4 var(--body);margin-top:5px}
.chart-footer{display:flex;align-items:center;gap:9px 16px;padding:7px clamp(10px,1.7vw,24px);background:var(--paper);border-top:1px solid var(--rule);color:var(--ink-soft);font:12px var(--body)}
.zoom-tools{display:flex;align-items:center;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.chart-footer button{font:500 13px var(--body);background:transparent;color:var(--ink);border:0;cursor:pointer;min-height:34px;padding:0 9px}
.chart-footer button:hover{background:var(--sea)}
.zoom-tools #zin,.zoom-tools #zout{font-size:19px;min-width:32px}
.zoom-tools output{min-width:38px;text-align:center;font:11px var(--mono)}
.zoom-tools #zfit{border-left:1px solid var(--rule);padding-inline:10px}
.chart-key{display:flex;align-items:center;gap:6px;white-space:nowrap}
.chart-key i{display:block;width:19px;height:4px;border-radius:5px;background:var(--direct-stroke)}
.chart-count{white-space:nowrap}
#zline{margin-left:auto;color:var(--direct-stroke);text-align:right}
aside.detail .in{padding:20px clamp(18px,2vw,30px) 40px;gap:22px}
.detail h2{font-style:normal;font-size:29px;letter-spacing:-.035em}
.detail .close{display:block;background:var(--paper);color:var(--ink-soft);border:0;border-bottom:1px solid var(--rule);cursor:pointer;text-align:left;padding:9px 20px;width:100%;font-size:12px}
[hidden]{display:none!important}
@media (min-width:861px) and (max-width:1140px){.chart-key{display:none}.chart-footer{gap:7px}.toolbar{gap:8px}}
@media (max-width:860px){
  header.top .wrap{padding:11px 14px 8px;gap:6px 14px}
  .sub{font-size:11px}
  nav.tabs{margin-left:0}
  nav.tabs a{padding:5px 10px;font-size:13px}
  .toolbar{padding:8px 10px;gap:6px 8px}
  .toolbar .chart-field{flex:1 1 90px;max-width:none}
  .chart-field select{height:38px;font-size:16px;max-width:100%;padding:0 2px 0 5px}
  .partner-toggle{gap:2px;font-size:12px;margin:0;min-height:38px}
  .chart-footer{padding:5px 7px;gap:5px;font-size:11px}
  .chart-footer button{min-height:36px}
  .chart-key{display:none}
  .chart-count{margin-left:3px}
  #zline{font-size:12px;padding:0 3px}
  aside.detail .close{font-size:14px;min-height:44px}
}
@media(max-width:420px){#zline span{display:none}header.top h1{font-size:21px}}
.card{width:var(--card-width,220px)}
.chart-key{position:relative;display:block}
.chart-key summary{list-style:none;cursor:pointer;padding:8px 3px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.chart-key summary::-webkit-details-marker{display:none}
.chart-key-body{position:absolute;z-index:5;bottom:calc(100% + 7px);left:0;background:var(--paper);border:1px solid var(--rule);border-radius:7px;box-shadow:var(--card-shadow);padding:10px 13px;display:grid;gap:9px}
.chart-key-body span{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--ink);font-size:12px}
.chart-key-body i{width:20px;height:0;border:0;border-top:2px solid var(--ink-soft);background:transparent;border-radius:0}
.chart-key-body i.direct-ink{border-width:4px;border-color:var(--direct-stroke)}
.chart-key-body i.co-ink{border-top-style:dashed}
.chart-key-body i.pending-ink{border-color:var(--magenta);border-top-style:dotted}
@media(max-width:470px){.toolbar .chart-field{flex-basis:41%}}
@media(max-width:600px){.card{min-height:72px;padding:10px 11px}.card .n{font-size:16px}.card .d{font-size:11px}.card .r{font-size:11px}.chart-key-body{left:-45px}header.top h1{text-wrap:initial}.chart-footer .chart-count{margin-left:0}}
@media(max-width:359px){.zoom-tools #zin,.zoom-tools #zout{min-width:25px;padding:0 6px}.zoom-tools #zfit{padding-inline:6px}.chart-footer{gap:4px}#zline{font-size:11px}}
@media (prefers-reduced-motion: no-preference){ .scroller{scroll-behavior:auto} }
</style>

<header class="top">
  <div class="wrap">
    <div>
      <h1 id="h1"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <nav class="tabs" aria-label="Views">
      <a href="#tree">Tree</a><a href="#ancestors">Ancestors</a><a href="#timeline">Timeline</a><a href="#research">Research log</a>
    </nav>
  </div>
  <div class="scale" aria-hidden="true"></div>
</header>

<main>
  <section class="view nodetail" id="tree">
    <div class="chartcol">
      <div class="toolbar" aria-label="Chart controls">
        <label class="chart-field" for="chart-view">Show<select id="chart-view">
          <option value="all">All family</option>
          <option value="direct">Direct line</option>
          <option value="jones">Jones descendants</option>
          <option value="morris">Airlie Morris’s ancestors</option>
          <option value="andrews">Isabel Andrews’s ancestors</option>
          <option value="herbert">Sarah Herbert’s ancestors</option>
          <option value="close">Close family</option>
        </select></label>

<script>
window.FAMILY = {"title": "The Jones family, <em>Jamaica to the London Docks<\/em>", "subtitle": "Historical records and family research", "start": "archimedes", "generations": ["I", "II", "III", "IV", "V", "VI", "VII"], "people": [{"id": "joseph", "name": "Joseph Jones", "born": "", "line": true, "role": "Reported as a merchant", "sources": [{"t": "Jones family sheet, 6 January 2000, page 1", "url": ""}, {"t": "The Olney household and the Jamaican evidence", "url": "research/herbert-jones-review.html"}, {"t": "Jamaican records for the men named Joseph Jones", "url": "research/herbert-jones-review.html#joseph-candidates"}, {"t": "Jamaica Archives and Island Record Office evidence", "url": "research/herbert-jones-review.html#heathfield-probate"}], "facts": [{"d": "1851", "t": "The family sheet identifies Joseph as the merchant named as father on Archimedas’s marriage certificate. The sheet questions the estimated birth year. The certificate itself is still needed.", "c": "f", "s": [1, 2]}, {"d": "Jamaican lead", "t": "An Old Heathfield proprietor of the same name died by the March 1819 returns. A Joseph E. Jones appears in subsequent returns elsewhere. A record connecting Archimedes to one of these men has yet to be found.", "c": "s", "s": [3, 4]}], "bio": ["<a href=\"research/herbert-jones-review.html#joseph-candidates\">See the records for the possible Jamaican identities<\/a>."]}, {"id": "archimedes", "parent": "joseph", "name": "Archimedes Jones", "born": "c.1815", "line": true, "role": "Steward of the Sailors' Home", "spouses": [{"name": "Sarah Herbert", "id": "sarah-herbert", "when": "7 October 1851", "c": "f"}], "facts": [{"d": "1851 census", "y": 1851, "t": "The detailed Aldgate census transcription places him at the Sailors’ Home on Well Street, unmarried, age 36, a cook born in Jamaica. The 1891 census again places him at the Home, by then a steward.", "c": "p", "s": [13, 10, 2]}, {"d": "1851", "t": "Married Sarah Herbert on 7 October at St Mary, Whitechapel. Both gave Dock Street addresses. The sheet names William Partridge and Mary Ann Herbert as witnesses. The civil index gives Whitechapel 2:713, and the parish register is P93/MRY1/046.", "c": "f", "s": [1, 14], "y": 1851}, {"d": "1891", "t": "At the Sailors’ Home on Well and Dock Streets. The census transcription records Archimedes Jones, 75, widowed, a steward born in Jamaica. The workplace, occupation and age match the family sheet. Sarah’s exact death date remains open.", "c": "c", "s": [2, 1], "y": 1891}, {"d": "1852–1873", "y": 1852, "t": "Three further candidates appear in baptism index searches under father Archimedes: Sarah Matilda, Margaret Agnes and Francis George. The parents’ names are masked in the baptism results. Corresponding civil birth and death entries fit 1852–1861, 1859–1881 and 1871–1873. A fourth candidate, Herbert Archimedes (birth Whitechapel 1c/352, death as Archimedus 1c/251, 1855–56), needs a record naming his parents. Full baptism or birth entries are needed to establish each mother and the total number of children.", "c": "p", "s": [3, 4, 5]}, {"d": "Reported Jamaican baptism, 1822", "y": 1822, "t": "A researcher transcribed a St Elizabeth baptism dated 10 October 1822 for Archimedes Jones, born 27 September 1815. The name, birthplace and age fit the London steward in 1891. The report says the entry omits his parents. The date and Jamaican parentage require the original register or another record linking the households.", "c": "p", "s": [6, 7, 2]}, {"d": "Death registration", "y": 1900, "t": "The original GRO index records his death in the Hastings district in January–March 1900, aged 84. That age is consistent with the reported September 1815 birth. The entry gives the registration quarter.", "c": "c", "s": [12]}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 1", "url": ""}, {"t": "FreeCEN, Whitechapel, 1891, RG12/283, folio 127, page 1", "url": "https://www.freecen.org.uk/search_records/59289624e937906e9ff06fe9/archimedes-jones-1891-london-city-whitechapel-1816-"}, {"t": "FreeBMD, civil registration indexes", "url": "https://www.freebmd2.org.uk/search_queries/new"}, {"t": "London baptisms, index search for father Archimedes Jones", "url": "https://www.ancestry.co.uk/search/collections/1558/?father=Archimedes_Jones&father_x=1"}, {"t": "Victorian sibling evidence review and index references", "url": "research/siblings-review.html"}, {"t": "FamilySearch, Jamaican parish register index", "url": "https://www.familysearch.org/ark:/61903/1:1:VH6X-71T"}, {"t": "RootsChat, researchers’ account of the register", "url": "https://www.rootschat.com/forum/index.php?topic=749260.0"}, {"t": "The Olney household and the Jamaican evidence", "url": "research/herbert-jones-review.html"}, {"t": "The Victorian siblings and their children", "url": "research/siblings-review.html"}, {"t": "1851 census, transcript of Jamaica-born residents in Britain", "url": "https://www.apex.net.au/~tmj/jam-cns.htm"}, {"t": "Jamaican Family Search, 1851 census place transcription", "url": "https://www.jamaicanfamilysearch.com/Samples/bcensus7.htm"}, {"t": "Original GRO death index via FreeBMD, 1900 Q1, Hastings 2b 21 (index p. 237)", "url": "https://www.freebmd.org.uk/cgi/information.pl?cite=GVR1R%2Bl4fVyp7rz02FQy1g&scan=1"}, {"t": "1851 Aldgate census, Sailors’ Home, Well Street, schedule 171", "url": "https://web.archive.org/web/20250115105329/https://freepages.rootsweb.com/~bewickgenealogy/genealogy/census/alg.htm"}, {"t": "Whitechapel marriage register and civil index", "url": "research/herbert-jones-review.html#whitechapel-marriage"}], "parents": [{"id": "joseph", "c": "f"}], "died": "1900", "bio": ["<a href=\"research/herbert-jones-review.html#earliest-jones\">Trace Archimedes from Jamaica to London and see the evidence for Joseph<\/a>."]}, {"id": "alice", "parent": "archimedes", "name": "Alice Mary Ann Jones", "born": "1853", "sources": [{"t": "Jones family sheet, 6 January 2000, page 1", "url": ""}, {"t": "FreeBMD, civil registration indexes", "url": "https://www.freebmd2.org.uk/search_queries/new"}, {"t": "London baptisms, index search for father Archimedes Jones", "url": "https://www.ancestry.co.uk/search/collections/1558/?father=Archimedes_Jones&father_x=1"}, {"t": "Victorian sibling evidence review and index references", "url": "research/siblings-review.html"}, {"t": "The Victorian siblings and their children", "url": "research/siblings-review.html"}, {"t": "Whitechapel birth and Stepney marriage research", "url": "research/siblings-review.html#alice"}], "facts": [{"d": "1881", "t": "Page 1 lists this child in Sarah’s household at 18A Arbour Square, with no occupation stated. The household census image remains to be checked.", "c": "f", "s": [1], "y": 1881}, {"d": "Birth registration, 1853", "y": 1853, "t": "Oct–Dec 1853, Whitechapel, volume 1c, page 372. The name, district and approximate age fit the family sheet. A London baptism index search under father Archimedes returns the corresponding child.", "c": "p", "s": [1, 2, 3, 4]}, {"d": "1881 marriage lead", "t": "Alice Mary Ann Jones and Edwin Cuthbert Church married at St Dunstan and All Saints, Stepney. The marriage register is P93/DUN/113. Three close London birth registrations carry the same full name. The entry must identify the bride’s father or another family connection to establish that she was this Alice.", "c": "s", "s": [6]}], "parents": [{"id": "archimedes", "c": "f"}, {"id": "sarah-herbert", "c": "f"}]}, {"id": "charles", "parent": "archimedes", "name": "Charles Henry Jones CBE", "born": "1857", "died": "1936", "line": true, "role": "Registrar General of Shipping and Seamen", "spouses": [{"name": "Isabel Andrews (also Isobel in the family papers)", "id": "isabel-andrews", "when": "25 October 1883", "c": "c"}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 1", "url": ""}, {"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "Who’s Who, 1920, Charles Henry Jones entry", "url": ""}, {"t": "London Gazette, printed CBE entry", "url": ""}, {"t": "1936 probate calendar, Charles Henry Jones", "url": ""}, {"t": "1948 probate calendar, Isabel Jones", "url": ""}, {"t": "Evening Post, 16 October 1926, Women in Print", "url": "https://paperspast.natlib.govt.nz/newspapers/EP19261016.2.148"}, {"t": "Charles Douglas casualty details, CWGC-derived listing", "url": "https://astreetnearyou.org/person/170545/Corporal---Crompton"}, {"t": "The Panama American, 27 June 1945", "url": "https://ufdc.ufl.edu/AA00010883/05684"}, {"t": "The Marine Engineer, November 1913, appointment notice", "url": ""}, {"t": "Board of Trade Journal, 1921, successor notice", "url": ""}, {"t": "1871 census, Limehouse, RG10/553, page 39, schedule 195", "url": "https://www.freecen.org.uk/search_records/62bff566f493fdf9f7a3d21f/isabel-andrews-1871-london-city-limehouse-1862-"}, {"t": "Charles Henry and Isabel Andrews", "url": "research/andrews-review.html"}], "facts": [{"d": "1857", "t": "Both family sheets give 31 March at 3 East Tenter Street, Whitechapel. Page 1 names his parents as Archimedas Jones and Sarah Herbert. The biographical entry independently agrees on the birth year.", "c": "f", "s": [1, 2, 3], "y": 1857}, {"d": "1883", "t": "His biographical entry identifies his wife as Isabel, daughter of John Andrews, and gives 1883 as their marriage year. Page 2 supplies 25 October. William Andrews appears there as a witness.", "c": "c", "s": [3, 2], "y": 1883}, {"d": "1913–18", "t": "Named Registrar General of Shipping and Seamen from 1913. His biographical entry and the Gazette identify his CBE in 1918.", "c": "c", "s": [3, 4], "y": 1918}, {"d": "1936–47", "t": "The 1936 calendar identifies widow Isabel and 1c Nevern Square. Her 1948 probate entry records death on 5 November 1947 at Wallingford and names Isabel Margaret Braund. Both match the family sheet.", "c": "c", "s": [5, 6, 2], "y": 1936}, {"d": "1926", "t": "Theodore’s engagement notice identifies his father by initials, CBE and office. It describes Theodore as his eldest surviving son, consistent with Charles Douglas’s death in 1916.", "c": "c", "s": [7, 8], "y": 1926}, {"d": "1945", "t": "The Panama paper reports Mrs C. H. Jones returning to England after several years with her son and daughter-in-law, Captain and Mrs T. Warren Jones. Her death at Wallingford in 1947 fits that return.", "c": "c", "s": [9, 6], "y": 1945}, {"d": "1873–1901", "y": 1873, "t": "Privately educated, he placed fourth in the 1873 competitive examination and entered the shipping registry as a third-class clerk. He advanced to staff clerk in 1891 and assistant to the Registrar General in 1901. He listed literature as his recreation.", "c": "c", "s": [3]}, {"d": "1913", "y": 1913, "t": "Succeeded H. N. Malan after forty years in the department. The appointment notice describes him as the first member of staff promoted to lead it.", "c": "c", "s": [10, 3]}, {"d": "1921", "y": 1921, "t": "The Board of Trade appointed John Blake Harrold MBE to succeed him. His later address, 1c Nevern Square, differs from the 11 Emperor’s Gate address listed in Who’s Who.", "c": "c", "s": [11, 3, 5]}, {"d": "Isabel’s childhood, 1871", "y": 1871, "t": "A likely match at 74 Cotton Street, Limehouse, is Isabel Andrews, 9, born Mile End. Her father John T. Andrews, 44, was a Customs gauger born in Shadwell. His wife Sarah A., 38, was born in St George in the East. Children John, William, Kate, Arthur, Frank and Annie and an aunt, Ann Potter, were also present. The father’s name and William fit the wedding evidence. The original marriage record or Isabel’s birth record would test this identification.", "c": "p", "s": [12, 3, 2]}], "parents": [{"id": "archimedes", "c": "f"}, {"id": "sarah-herbert", "c": "f"}]}, {"id": "ernest", "parent": "archimedes", "name": "Ernest Augustus Jones", "born": "1860", "sources": [{"t": "Jones family sheet, 6 January 2000, page 1", "url": ""}, {"t": "FreeBMD, civil registration indexes", "url": "https://www.freebmd2.org.uk/search_queries/new"}, {"t": "London baptisms, index search for father Archimedes Jones", "url": "https://www.ancestry.co.uk/search/collections/1558/?father=Archimedes_Jones&father_x=1"}, {"t": "Victorian sibling evidence review and index references", "url": "research/siblings-review.html"}, {"t": "The Victorian siblings and their children", "url": "research/siblings-review.html"}, {"t": "The London Archives, St Mary marriage register P83/MRY1/1248", "url": "https://search.lma.gov.uk/LMA_DOC/P83_MRY1.PDF#page=15"}, {"t": "Islington marriage and other index evidence", "url": "research/siblings-review.html#ernest"}], "facts": [{"d": "1881", "t": "Page 1 lists this child in Sarah’s household at 18A Arbour Square, with shipbroker’s clerk. The household census image remains to be checked.", "c": "f", "s": [1], "y": 1881}, {"d": "Birth registration, 1860", "y": 1860, "t": "Oct–Dec 1860, Whitechapel, volume 1c, page 409. The name, district and approximate age fit the family sheet. A London baptism index search under father Archimedes returns the corresponding child.", "c": "p", "s": [1, 2, 3, 4]}, {"d": "1882", "y": 1882, "t": "Ernest Augustus Jones and Katherine Mingay Smith appear on the same Islington marriage index page, Jan–Mar 1882, 1b/366. The parish marriage index identified in the recovered notes names his father Archimedes and pairs the couple.", "c": "p", "s": [2, 4]}, {"d": "1882 parish", "t": "The Guild’s marriage locator assigns Islington 1b/366 to St Mary, Upper Street. That quarter falls in parish register P83/MRY1/1248, microfilm X085/103. The family relationships come from the parish and civil index entries. The full marriage register has yet to be inspected.", "c": "p", "s": [6, 7]}, {"d": "1918 marriage lead", "t": "A Stepney marriage entry, 1c/454, pairs an Ernest A. Jones with Amy Louisa Ansell Argent. The parish index returns a groom of the right name and approximate age. His father’s name or other evidence is still needed before arch/collections/2352/?name=_Jones&father=William_Jones&mother=Ethel+Susie_Jones&mother_x=1"}, {"t": "Victorian sibling evidence review and index references", "url": "research/siblings-review.html"}, {"t": "The Victorian siblings and their children", "url": "research/siblings-review.html"}, {"t": "Contemporary Art Society biography", "url": "https://contemporaryartsociety.org/artists/eric-stephen-jones"}, {"t": "The Prodigal Son, British Museum acquisition record", "url": "https://contemporaryartsociety.org/objects/prodigal-son-1927"}, {"t": "England and Wales probate calendar 1962, p. 295", "url": "https://probatesearch.service.gov.uk/api/csp/nxfile/default/de63c3c8-fda6-4d6c-a6cd-015900b670ed/file:content/005167_jones_1962.pdf"}, {"t": "FreeBMD, Sheffield death index, 2d/120", "url": "https://www.freebmd2.org.uk/entry-information/hash?id=%2B0FqZxeoZdXeVNGKavoEMg"}], "facts": [{"d": "1904", "t": "The family sheet calls Eric Stephen and Harold Edward twins. The Contemporary Art Society independently identifies the illustrator Harold Jones as Eric’s twin brother.", "c": "f", "s": [1, 6], "y": 1904}, {"d": "1904–1911", "y": 1904, "t": "Birth registered in Romford, Jan–Mar 1904, 4a/572. The 1911 census index places him with William Edward Joseph and Ethel Susie, and the family papers identify the brothers as twins.", "c": "p", "s": [2, 3, 1, 4]}, {"d": "1927–1931", "t": "Studied at Camberwell and the Royal College of Art and held a Rome scholarship in engraving. He later taught at Sheffield College of Art. The British Museum acquired his 1927 wood engraving The Prodigal Son in 1930.", "c": "c", "s": [6, 7], "y": 1927}, {"d": "1962 probate", "t": "Died on 2 January 1962. The Sheffield civil death entry and the Wakefield probate grant agree on the year. The biography also displays 1963 in its heading.", "c": "c", "s": [8, 6, 9], "y": 1962}], "parents": [{"id": "william", "c": "p"}, {"id": "ethel-corby", "c": "p"}], "died": "1962", "role": "Engraver and art teacher"}, {"i ily papers identify the brothers as twins.", "c": "p", "s": [2, 3, 1, 4]}, {"d": "1904 birth", "t": "Born 22 February 1904, the date recorded in the archive biography and the Wandsworth civil death index. The Romford birth quarter agrees.", "c": "c", "s": [6, 2, 11], "y": 1904}, {"d": "1933 marriage", "t": "Married Mollie Merry. The name and year in his archive biography agree with the reciprocal civil index references, Kensington 1a/527, July–September 1933.", "c": "c", "s": [6, 9], "y": 1933}, {"d": "Illustration", "t": "Illustrated Lavender’s Blue, compiled by Kathleen Lines. It received a special commendation for the 1954 Carnegie Medal. During the Second World War he worked as a cartographer.", "c": "c", "s": [6, 8, 10], "y": 1954}, {"d": "1992 probate", "t": "Died on 10 June 1992. The probate calendar gives a Putney address that also appears in Mollie’s grant the following year.", "c": "c", "s": [7], "y": 1992}], "parents": [{"id": "william", "c": "p"}, {"id": "ethel-corby", "c": "p"}], "died": "1992", "role": "Illustrator and writer", "spouses": [{"name": "Mollie Merry", "id": "mollie-merry", "when": "1933, Kensington", "c": "c"}]}, {"id": "cdj", "parent": "charles", "name": "Charles Douglas Jones", "born": "1884", "died": "1916", "role": "Lieutenant, King’s Own Yorkshire Light Infantry", "spouses": [{"name": "Constance Isabella Stamp", "id": "constance-stamp", "c": "c", "when": "1916, London"}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "Cambrin Churchyard Extension casualty roll, Charles Douglas Jones", "url": "https://astreetnearyou.org/cemetery/16800/CAMBRIN-CHURCHYARD-EXTENSION"}, {"t": "Cambrin casualty details reproduced from CWGC", "url": "https://astreetnearyou.org/person/170545/Corporal---Crompton"}, {"t": "Friends of Hastings Cemetery, Stamp family history", "url": "https://friendsofhastingscemetery.org.uk/stampeb.html"}, {"t": "Sevenoaks war memorial gallery", "url": "https://sevenoaksww1.org/war-memorial-gallery/"}], "facts": [{"d": "1916", "t": "The cemetery roll lists Lieutenant Charles Douglas Jones, aged 32, of the regiment named on page 2, dying on 28 October. The sheet gives the regiment and year. Claude’s transcription supplied 1 July in error.", "c": "c", "s": [1, 2], "y": 1916}, {"d": "1916", "t": "The casualty entry identifies his father by his distinctive office and Constance Isabella, née Stamp, as his wife at Sevenoaks. Those details corroborate the 28 October death date and distinguish him from other officers named Jones.", "c": "c", "s": [3, 1], "y": 1916}, {"d": "Stamp family", "t": "The Friends of Hastings Cemetery identifies Constance as a daughter of Ernest Blatspiel Stamp and Frances. The family lived at Sevenoaks. Her brother Douglas Blatspiel Stamp served with the East Yorkshire Regiment and appears on the town memorial.", "c": "p", "s": [4, 5]}], "parents": [{"id": "charles", "c": "f"}, {"id": "isabel-andrews", "c": "f"}]}, {"id": "douglas", "parent": "cdj", "name": "Douglas Brisbane-Jones-Stamp", "born": "1917", "died": "1975", "spouses": [{"name": "Jean Marion Pamela Monro", "note": "The family sheet uses Arethusa. The regimental appreciation calls her Tush.", "id": "marion-monro", "c": "c", "when": "6 October 1942"}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "The Iron Duke, October 1942, engagement notice", "url": "https://www.dwr.org.uk/wp-content/uploads/ID-053-1942-10.pdf"}, {"t": "The Iron Duke, December 1975, obituary", "url": "https://www.dwr.org.uk/wp-content/uploads/ID-169-1975-12.pdf"}, {"t": "The Iron Duke, August 1976, appreciation, p. 71", "url": "https://www.dwr.org.uk/wp-content/uploads/ID-171-1976-08.pdf"}, {"t": "The Iron Duke, August 1975, headquarters news", "url": "https://www.dwr.org.uk/wp-content/uploads/ID-168-1975-08.pdf"}, {"t": "The Iron Duke, February 1943, marriage notice", "url": "https://www.dwr.org.uk/wp-content/uploads/ID-054-1943-02.pdf"}, {"t": "Oxford Dictionary of National Biography, Hector Monro", "url": "https://academic.oup.com/oxford-dictionary-of-national-biography/reference/63486/reference-article-abstract/581193560"}], "facts": [{"d": "1917", "t": "The regimental obituary gives February 1917. The 1942 engagement identifies Captain Douglas Jones-Stamp as the only son of the late Charles Douglas Jones and names Marion Monro. These identifiers connect the soldier to page 2.", "c": "c", "s": [1, 2, 3], "y": 1917}, {"d": "1943–45", "t": "Reached Italy in December 1943, was wounded at Anzio and later captured. His regiment places him in Oflag 79 until April 1945. The sheet’s 1941 start conflicts with this service chronology.", "c": "c", "s": [4, 1], "y": 1945}, {"d": "1975", "t": "Died on 20 October in hospital in Carlisle, ten years later than the family sheet records. His regiment had reported his departure as assistant regimental secretary that August.", "c": "c", "s": [3, 5, 1], "y": 1975}, {"d": "Monro family", "t": "The regimental marriage notice identifies Marion as the only daughter of Captain Alastair Monro of Craigcleuch. The Oxford biographical account of her brother Hector identifies the parents as Ian Alastair Seymour Hale Monro and Marion Frances Ewart. Her maternal grandfather was Lieutenant-General Sir John Spencer Ewart.", "c": "p", "s": [6, 7]}], "parents": [{"id": "cdj", "c": "c"}, {"id": "constance-stamp", "c": "p"}]}, {"id": "twj", "parent": "charles", "name": "Theodore Warren Jones", "born": "1887", "line": true, "role": "Commander, RNR (retired list)", "spouses": [{"name": "Airlie May Morris", "when": "16 December 1926", "life": "1895–1977", "id": "airlie", "c": "c"}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "London Gazette, January 1918, p. 380", "url": "https://www.thegazette.co.uk/London/issue/30460/supplement/380"}, {"t": "London Gazette, November 1927, p. 7665", "url": ""}, {"t": "Family message accompanying the sheets", "url": ""}, {"t": "Alexander Turnbull eparture notice names his children Betty and Warren and his wife’s mother, Mrs George Morris. The family clipping and the archived issue preserve the same report.", "c": "c", "s": [16, 17], "y": 1946}, {"d": "1960", "t": "New Zealand registered his death at a reported age of 74. A birth in 1887 would make him 72 or 73.", "c": "c", "s": [18, 11], "y": 1960}, {"d": "Airlie’s grandparents", "y": 1868, "c": "p", "s": [19, 20, 21], "t": "The Sydney marriage notice identifies Airlie’s likely maternal grandmother as Mary Eliza Bell, daughter of Edward Bell, civil engineer. William Dymock’s probate names Mary Eliza as his widow and his obituary identifies Airlie’s mother, Mrs George Morris, as his daughter."}], "died": "1960", "bio": ["<a href=\"research/Morris and earlier families.html\">Follow Airlie’s Morris, Dymock, Moodie and earlier Scottish lines<\/a>.", "<a href=\"research/Morris and earlier families.html#daisy\">Read about Airlie’s Dymock and Bell ancestors<\/a>."], "parents": [{"id": "charles", "c": "c"}, {"id": "isabel-andrews", "c": "c"}]}, {"id": "warren", "parent": "twj", "name": "Warren Theodore Jones", "born": "1927", "line": true, "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "Family message accompanying the sheets", "url": ""}, {"t": "New Zealand Herald, family notice, 5 January 2022", "url": ""}, {"t": "New Zealand historical index 2022/605", "url": "research/NZ historical register entries.html#r2022-605"}, {"t": "Family clipping of the 1946 departure report", "url": "https://ufdc.ufl.edu/AA00010883/05967"}, {"t": "The Panama American, 11 January 1946, departure for New Zealand", "url": "https://ufdc.ufl.edu/AA00010883/05967"}, {"t": "Union shipping magazine, Linkspan, December 1984", "url": "https://pubhtml5.com/hhtj/juhq/basic/"}, {"t": "Company-director index, Owens Ships 5700", "url": "https://www.companiesnz.com/person/119896/owens-ships-5700-limited"}], "died": "2021", "facts": [{"d": "2021", "t": "The New Zealand historical register records his death on 31 December 2021.", "c": "c", "s": [4], "y": 2021}, {"d": "1927", "t": "The death register records his birth as 31 December 1927, supporting the photographed family sheet. The exact-date search also places his death on 31 December 2021, his 94th birthday. The birthplace remains open.", "c": "c", "s": [4, 1], "y": 1927}, {"d": "1946", "t": "Named with his sister Betty as one of Captain and Mrs T. Warren Jones’s children in the Panama newspaper.", "c": "c", "s": [5, 6], "y": 1946}, {"d": "1984", "t": "A Union shipping staff magazine identifies Warren Jones as Owens Group general manager of shipping at a Wellington farewell. A company-director index lists Warren Theodore Jones at Owens Ships 5700. Employer, name and city support the identification.", "c": "p", "s": [7, 8], "y": 1984}], "bio": ["<a href=\"research/Morris and earlier families.html\">Read the family evidence and follow the maternal line<\/a>."], "parents": [{"id": "twj", "c": "c"}, {"id": "airlie", "c": "c"}], "spouses": []}, {"id": "betty", "parent": "twj", "name": "Elizabeth Airlie “Betty” Jones", "born": "1929", "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "Don Ferguson, Elizabeth Airlie Jones", "url": "https://www.fergusontree.com/p190.htm"}, {"t": "The Panama American, 19 July 1929", "url": "https://ufdc.ufl.edu/AA00010883/04785"}, {"t": "The Panama American, 19 July 1944", "url": "https://ufdc.ufl.edu/AA00010883/05064"}, {"t": "The Panama American, 14 January 1952", "url": "https://ufdc.ufl.edu/AA00010883/01354"}, {"t": "New Zealand historical index 2006/5183", "url": "research/NZ historical register entries.html#r2006-5183"}, {"t": "Ferguson, NZ marriage and death references", "url": "https://www.fergusontree.com/p190.htm"}], "facts": [{"d": "1929–44", "t": "The 1929 paper announces the birth of Theodore and Airlie’s daughter at Panama Hospital on 17 July. The 1944 paper calls her Betty and describes her fifteenth birthday at her parents’ home. The family sheet has 1930.", "c": "c", "s": [3, 4, 1], "y": 1929}, {"d": "1952–2006", "t": "Her parents’ engagement notice names Elizabeth and Dr William Wilson of Lower Hutt and announces a February wedding in Paihia. The NZ death entry for Elizabeth Airlie Wilson records 17 July 1929. The reported middle name Johnstone for William is from Ferguson’s marriage-index reference.", "c": "c", "s": [5, 6, 7], "y": 1952}], "died": "2006", "spouses": [{"name": "William Johnstone Wilson", "id": "william-wilson", "c": "p", "when": "1952"}], "bio": ["<a href=\"research/Morris and earlier families.html\">Read the family evidence and follow the maternal line<\/a>."], "parents": [{"id": "twj", "c": "c"}, {"id": "airlie", "c": "c"}]}, {"id": "hmj", "parent": "charles", "name": "Henry Montagu Jones", "born": "1891", "died": "1936", "spouses": [{"name": "Ethel Paley", "id": "ethel-paley", "c": "c", "when": "1917, Kensington"}], "sources": [{"t": "Jones family sheet, 6 January 2000, page 2", "url": ""}, {"t": "Hartpury, Gloucestershire, memorial inscription A76", "url": "https://places.wishful-thinking.org.uk/GLS/Hartpury/MIs.html"}, {"t": "St George, Preston, baptism register, page 25, entry 194", "url": "https://www.lan-opc.org.uk/Preston/Preston/stgeorge/baptisms_1865-1901.html"}, {"t": "National Archives, divorce file J 77/1266/8590", "url": "https://discovery.nationalarchives.gov.uk/details/r/C8011865"}, {"t": "Recovered research, including marriage index transcription", "url": ""}], "facts": [{"d": "Family sheet", "t": "Page 2 gives 8 December 1891 at 61 St Donatt’s Road and reports death in Costa Rica in June 1936. The Marylebone marriage location carries a question mark.", "c": "f", "s": [1]}, {"d": "Paley family", "t": "At Hartpury the family memorial calls Ethel the widow of Henry Montague Jones of San Jose, Costa Rica, and a daughter of George and Agnes Paley of Preston. This independently connects her maiden name, parents, husband and his home ci const chartEvidence = $('#chart-evidence'), ancestorEvidence = $('#ancestor-evidence');
let closePerson = F.start || P[0].id, includePartners = true, evidenceChangedFromAncestors = false;
const branchRoots = {jones:'joseph', morris:'airlie', andrews:'isabel-andrews', herbert:'sarah-herbert'};
for (const [view, id] of Object.entries(branchRoots)) {
  if (!byId[id]) chartView.querySelector('[value="' + view + '"]')?.remove();
}
for (const {view, id, label} of F.ancestorBranches || []) {
  if (!byId[id]) continue;
  branchRoots[view] = id;
  chartView.add(new Option(label, view), chartView.querySelector('[value="close"]'));
}
const matchesEvidence = (confidence, mode) => mode === 'all' || (confidence === 'c') === (mode === 'confirmed');
function chartFamilies(mode) {
  const families = new Map();
  function familyFor(ids) {
    const key = [...ids].sort().join('/');
    if (!families.has(key)) families.set(key, {
      parents:ids.map(id => byId[id]), children:[], pendingChildren:new Set(), partnership:false, confirmedPartnership:false
    });
    return families.get(key);
  }
  for (const person of P) {
    for (const spouse of person.spouses || []) {
      if (!byId[spouse.id] || !matchesEvidence(spouse.c, mode)) continue;
      const family = familyFor([person.id, spouse.id]);
      family.partnership = true;
      if (spouse.c === 'c') family.confirmedPartnership = true;
    }
    const parents = parentsOf(person).filter(parent => matchesEvidence(parent.c, mode));
    if (!parents.length) continue;
    const family = familyFor(parents.map(parent => parent.id));
    family.children.push(person);
    if (parents.some(parent => parent.c !== 'c')) family.pendingChildren.add(person);
  }
  return [...families.values()];
}

function relatedPeople(families, anchors) {
  const links = new Map(P.map(person => [person, new Set()]));
  for (const {parents, children} of families) {
    const [first, ...others] = parents;
    for (const person of [...others, ...children]) {
      links.get(first).add(person);
      links.get(person).add(first);
    }
  }
  const found = new Set(anchors.filter(Boolean));
  for (const person of found) links.get(person).forEach(relative => found.add(relative));
  return found;
}

function chartPeople(families) {
  const view = chartView.value;
  const mode = chartEvidence.value;
  const traversable = confidence => mode !== 'confirmed' || confidence === 'c';
  const core = new Set();
  if (view === 'all') {
    P.filter(person => includePartners || person.line || parentsOf(person).length ||
      familyChildren[person.id].length || !person.spouses?.length).forEach(person => core.add(person));
  } else if (view === 'direct') {
    P.filter(p => p.line).forEach(p => core.add(p));
  } else if (view === 'close') {
    const person = byId[closePerson];
    core.add(person);
    for (const parent of parentsOf(person).filter(parent => traversable(parent.c))) {
      core.add(byId[parent.id]);
      familyChildren[parent.id].filter(child => traversable(child.confidence)).forEach(({person:sibling}) => core.add(sibling));
    }
    familyChildren[person.id].filter(child => traversable(child.confidence)).forEach(({person:child}) => core.add(child));
  } else {
    const pending = [byId[branchRoots[view]]];
    while (pending.length) {
      const person = pending.pop();
      if (!person || core.has(person)) continue;
      core.add(person);
      if (view === 'jones') familyChildren[person.id].filter(child => traversable(child.confidence)).forEach(({person:child}) => pending.push(child));
      else parentsOf(person).filter(parent => traversable(parent.c)).forEach(parent => pending.push(byId[parent.id]));
    }
  }
  if (includePartners && view !== 'all') {
    const original = new Set(core);
    for (const {parents} of families) {
      if (parents.some(person => original.has(person))) parents.forEach(person => core.add(person));
    }
  }
  if (mode === 'confirmed') {
    const anchor = byId[view === 'close' ? closePerson : branchRoots[view]];
    const connected = relatedPeople(families, anchor ? [anchor] : [byId[F.start], byId[F.ancestorStart]]);
    for (const person of core) if (!connected.has(person)) core.delete(person);
  } else if (mode === 'pending') {
    const matches = new Set();
    for (const {parents, children} of families) {
      const linkedParents = parents.filter(person => core.has(person));
      const linkedChildren = children.filter(person => core.has(person));
      if (linkedParents.length && (linkedParents.length > 1 || linkedChildren.length)) {
        [...linkedParents, ...linkedChildren].forEach(person => matches.add(person));
      }
    }
    return matches;
  }
  return core;
}

let visiblePeople, groupOf, rows, visibleFamilies, W;
function layoutChart() {
  const compact = window.matchMedia('(max-width:600px)').matches;
  CW = compact ? Math.min(170, Math.max(138, Math.floor((window.innerWidth - 60) / 2))) : 220;
  PARTNER_GAP = compact ? 26 : 42;
  PADX = compact ? 14 : 32;
  canvas.style.setProperty('--card-width', CW + 'px');
  const families = chartFamilies(chartEvidence.value);
  visiblePeople = chartPeople(families);
  visibleFamilies = families.map(family => ({
    ...family,
    parents:family.parents.filter(p => visiblePeople.has(p)),
    children:family.children.filter(p => visiblePeople.has(p))
  })).filter(family => family.parents.length && (family.children.length || family.parents.length > 1));
  // A person has one card even when linked to several partners or families.
  groupOf = new Map();
  const groups = new Set([...visiblePeople].map(person => {
    const group = {people:[person], above:new Set(), below:new Set()};
    groupOf.set(person, group);
    return group;
  }));
  for (const {parents} of visibleFamilies) {
    const together = groupOf.get(parents[0]);
    for (const partner of parents.slice(1)) {
      const other = groupOf.get(partner);
      if (other === together) continue;
      for (const person of other.people) {
        together.people.push(person);
        groupOf.set(person, together);
      }
      groups.delete(other);
    }
  }
  for (const {parents, children} of visibleFamilies) {
    const group = groupOf.get(parents[0]);
    for (const child of children) {
      const next = groupOf.get(child);
      if (next === group) continue;
      group.below.add(next);
      next.above.add(group);
    }
  }

  // Keep parents one row above their children wherever the recorded links agree.
  let generationConflict = false;
  for (const group of groups) {
    if (group.generation != null) continue;
    group.generation = 0;
    const component = [group];
    for (const member of component) {
      for (const [neighbors, step] of [[member.above, -1], [member.below, 1]]) {
        const expected = member.generation + step;
        for (const neighbor of neighbors) {
          if (neighbor.generation == null) {
            neighbor.generation = expected;
            component.push(neighbor);
          } else if (neighbor.generation !== expected) generationConflict = true;
        }
      }
    }
    const first = Math.min(...component.map(member => member.generation));
    component.forEach(member => member.generation -= first);
  }
  if (generationConflict) {
    // For unequal paths through the ancestry, allow the longer path to set the row.
    const incoming = new Map([...groups].map(group => [group, group.above.size]));
    const ready = [...groups].filter(group => !incoming.get(group));
    groups.forEach(group => group.generation = 0);
    for (const group of ready) {
      for (const child of group.below) {
        child.generation = Math.max(child.generation, group.generation + 1);
        incoming.set(child, incoming.get(child) - 1);
        if (!incoming.get(child)) ready.push(child);
      }
    }
  }
  rows = Array.from({length:Math.max(0, ...[...groups].map(group => group.generation)) + 1}, () => []);
  const order = new Map(P.map((person, i) => [person, i]));
  for (const group of groups) {
    group.people.sort((a, b) => order.get(a) - order.get(b));
    group.width = group.people.length * (CW + PARTNER_GAP) - PARTNER_GAP;
    rows[group.generation].push(group);
  }
  function rowWidth(row) {
    return Math.max(0, row.reduce((width, group) => width + group.width + FAMILY_GAP, -FAMILY_GAP));
  }
  W = Math.max(...rows.map(rowWidth)) + PADX * 2;
  function positionRow(row) {
    let x = (W - rowWidth(row)) / 2;
    if (chartView.value === 'direct' && row.length === 1 && row[0].people[0].line) x = PADX;
    for (const group of row) {
      group.x = x + group.width / 2;
      group.people.forEach((person, i) => person._x = x + i * (CW + PARTNER_GAP));
      x += group.width + FAMILY_GAP;
    }
  }
  function orderRow(row, direction) {
    const preferred = new Map(row.map(group => {
      const neighbors = [...group[direction]];
      return [group, neighbors.length ? neighbors.reduce((sum, next) => sum + next.x, 0) / neighbors.length : group.x];
    }));
    row.sort((a, b) => preferred.get(a) - preferred.get(b));
    positionRow(row);
  }
  rows.forEach(positionRow);
  for (let pass = 0; pass < 3; pass++) {
    [...rows].reverse().forEach(row => orderRow(row, 'below'));
    rows.forEach(row => orderRow(row, 'above'));
  }
}

const canvas = $('#canvas'), scroller = $('#scroller'), sizer = $('#sizer');
let H = 0, zoom = 1, sel = null;

function cardHTML(p){

    `<span class="t"><span class="n">${esc(p.name)}</span>` + (span(p) ? `<span class="d">${esc(span(p))}</span>` : '') +
    (p.role ? `<span class="r">${esc(p.role)}</span>` : '') + `</span>`;
}
const centerX = p => p._x + CW / 2;
const hasTrack = ({parents, children}) => children.length > 0 ||
  (parents.length > 1 && Math.max(...parents.map(p => p._x)) - Math.min(...parents.map(p => p._x)) > CW + PARTNER_GAP);

  const paths = [], directPaths = [];

    const {parents, children, partnership, confirmedPartnership, pendingChildren} = family;
    const ordered = [...parents].sort((a, b) => a._x - b._x);
    const left = ordered[0], right = ordered.at(-1);
    const x = (centerX(left) + centerX(right)) / 2;
    const track = rowBottom + 23 + trackIndex * 10;
    if (hasTrack(family)) trackIndex++;
    let y = left._y + left._h;
    if (left !== right) {
      const pending = partnership ? !confirmedPartnership : children.every(child => pendingChildren.has(child));
      const union = (partnership ? 'union' : 'union coparents') + (pending ? ' pending' : '');
      if (right._x === left._x + CW + PARTNER_GAP) {
        y = left._y + Math.min(left._h, right._h) / 2;
        paths.push(`<path class="${union}" d="M${left._x + CW},${y}H${right._x}"/>`);
      } else {
        y = track;
        paths.push(`<path class="${union}" d="M${centerX(left)},${left._y + left._h}V${y}H${centerX(right)}V${right._y + right._h}"/>`);
      }
    }
    for (const child of children) {
      const direct = child.line && parents.some(person => person.line);
      const classes = (direct ? 'line' : '') + (pendingChildren.has(child) ? ' pending' : '');
      (direct ? directPaths : paths).push(`<path class="${classes}" d="M${x},${y}V${track}H${centerX(child)}V${child._y}"/>`);
    }
  });

}
function build(){
  layoutChart();

  canvas.innerHTML = '';
  const els = {};
  visiblePeople.forEach(p => { const b = document.createElement('button'); b.className = 'card' + (p.line ? ' line' : '') + (p.unknown ? ' unknown' : '');
    b.id = 'c-' + p.id; b.style.left = p._x + 'px'; b.innerHTML = cardHTML(p); b.addEventListener('click', () => {
      history.replaceState(null, '', '#person/' + p.id);
      select(p.id, true);
    });
    canvas.appendChild(b); els[p.id] = b; });
  const rowBottoms = [], familiesByRow = rows.map(() => []);
  for (const family of visibleFamilies) {
    familiesByRow[groupOf.get(family.parents[0]).generation].push(family);
  }
  let y = PADY;
  rows.forEach((row, i) => {
    const people = row.flatMap(group => group.people);
    for (const person of people) {
      person._y = y;
      person._h = els[person.id].offsetHeight;
      els[person.id].style.top = y + 'px';
    }
    const tracks = familiesByRow[i].filter(hasTrack);
    rowBottoms[i] = y + Math.max(0, ...people.map(person => person._h));
    y = rowBottoms[i] + 54 + tracks.length * 10;
  });

  const paths = familiesByRow.map((families, i) => familyPaths(families, rowBottoms[i])).join('');
  canvas.insertAdjacentHTML('afterbegin', `<svg aria-hidden="true" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}</svg>`);
  $('#chart-empty').hidden = visiblePeople.size > 0;
  $('#chart-count').textContent = visiblePeople.size + ' of ' + P.length + ' people';
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; setZoom(zoom);
}
const fitZoom = () => Math.min(scroller.clientWidth / W, scroller.clientHeight / H, 1);
const canvasInset = () => Math.max(0, (scroller.clientWidth - W * zoom) / 2);
function setZoom(z) {

  canvas.style.left = canvasInset() + 'px';
  sizer.style.width = Math.max(scroller.clientWidth, W * zoom) + 'px';
  sizer.style.height = H * zoom + 'px';

function centre(id) {

  scroller.scrollTop = chartY * zoom - y;

function fitChart() {

$('#zin').onclick = () => zoomAtCenter(1.25);
$('#zout').onclick = () => zoomAtCenter(.8);

let drag = null;
scroller.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' || e.target.closest('.card')) return; drag = {x: e.clientX, y: e.clientY, l: scroller.scrollLeft, t: scroller.scrollTop}; scroller.classList.add('drag'); });

const touches = new Map();

  const bounds = scroller.getBoundingClientRect();

}

  const [a, b = a] = touches.values();

    chartY:(scroller.scrollTop + point.y) / zoom

  const lb = document.createElement('div'); lb.className = 'lightbox'; lb.innerHTML = `<img src="${img(f)}" alt=""><p>${esc(m.caption || '')}${m.credit ? ' — ' + esc(m.credit) : ''}</p>`;
  lb.onclick = () => lb.remove(); document.body.appendChild(lb); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const lb = $('.lightbox'); if (lb) lb.remove(); } });

/* ---------- timeline ---------- */
function timeline(){
  const ev = [];
  P.forEach(p => (p.facts || []).forEach(f => { if (f.y) ev.push({y: f.y, id: p.id, t: f.t, c: f.c}); }));
  (F.context || []).forEach(c => ev.push({y: c.y, t: c.t, ctx: true}));
  ev.sort((a, b) => a.y - b.y || (a.ctx ? -1 : 1));
  const dec = {}; ev.forEach(e => { const k = Math.floor(e.y / 10) * 10; (dec[k] = dec[k] || []).push(e); });
  $('#tlwrap').innerHTML = `<h2>Timeline</h2><p class="lede">Every dated event in the tree in one sequence, with the wider events the family lived through in italics.</p>` +
    Object.keys(dec).sort((a, b) => a - b).map(k => `<div class="decade"><b>${k}s</b><ul class="tl">` + dec[k].map(e => e.ctx ?
      `<li class="ctx"><span class="y">${e.y}</span><span>${e.t}</span></li>` :
      `<li><span class="y">${e.y}</span><span><button data-go="${e.id}">${esc(byId[e.id].name)}</button> · ${e.t} ${chip(e.c)}</span></li>`).join('') + `</ul></div>`).join('');
}
$('#tlwrap').addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) showProfile(g.dataset.go); });

/* ---------- ancestors ---------- */
function ancestorBranch(id, confidence, root = false) {
  const person = byId[id];
  const mode = ancestorEvidence.value;
  const parents = parentsOf(person)
    .filter(parent => mode !== 'confirmed' || parent.c === 'c')
    .map(parent => ancestorBranch(parent.id, parent.c ?? 'f')).join('');
  if (mode === 'pending' && !root && confidence === 'c' && !parents) return '';
  if (mode === 'pending' && root && !parents) return '<li>No ancestor relationships in this branch are pending review.</li>';
  return `<li><button class="ancestor-person" data-go="${id}"><strong>${esc(person.name)}</strong><small>${esc(span(person))}</small>${chip(confidence)}</button>` +
    (parents ? `<ul class="ancestor-list">${parents}</ul>` : '') + '</li>';
}
function renderAncestors(id) {
  ancestorPicker.value = id;
  $('#ancestor-list').innerHTML = `<ul class="ancestor-list">${ancestorBranch(id, undefined, true)}</ul>`;
}
ancestorPicker.addEventListener('change', () => showAncestors(ancestorPicker.value));
ancestorEvidence.onchange = () => {
  chartEvidence.value = ancestorEvidence.value;
  evidenceChangedFromAncestors = true;
  renderAncestors(ancestorPicker.value);
};
$('#ancestor-list').addEventListener('click', e => {
  const person = e.target.closest('[data-go]');
  if (person) showProfile(person.dataset.go);
});
function showProfile(id) {
  const hash = '#person/' + id;
  if (location.hash === hash) select(id, false);
  else location.hash = hash;
}
function showAncestors(id) {
  const hash = '#ancestors/' + id;
  if (location.hash === hash) renderAncestors(id);
  else location.hash = hash;
}

/* ---------- research log ---------- */
function research(){
  const N = F.notes || {}, sec = (t, a) => a && a.length ? `<div><h3>${t}</h3><ul>${a.map(x => `<li>${x}</li>`).join('')}</ul></div>` : '';
  $('#rswrap').innerHTML = `<h2>Research log</h2><p class="lede">${N.intro || ''}</p><div class="rs">` +
    `<div><h3>How sure is each statement</h3><div class="key">${Object.keys(CONF).map(k => `<span>${chip(k)} ${CONF[k][1]}</span>`).join('')}</div></div>` +
    sec('What the research added', N.found) + sec('Corrections to the family notes', N.corrections) +
    sec('Still unknown', N.questions) + sec('Where to look next', N.next) + sec('Picture credits', (F.images || []).map(i =>
      `${esc(i.caption)}. ${esc(i.credit || '')}${i.licence ? ' (' + esc(i.licence) + ')' : ''}${i.source_url ? ` <a href="${esc(i.source_url)}" target="_blank" rel="noopener">source</a>` : ''}`)) + `</div>`;
}

/* ---------- routing ---------- */
function route(){
  const [view,id] = location.hash.slice(1).split('/');
  const v = ['ancestors', 'timeline', 'research'].includes(view) ? view : 'tree';
  document.querySelectorAll('section.view').forEach(s => s.hidden = s.id !== v);
  document.querySelectorAll('nav.tabs a').forEach(a => a.getAttribute('href') === '#' + v ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (v === 'ancestors') renderAncestors(view === 'ancestors' && byId[id] ? id : ancestorPicker.value);
  if (v === 'tree' && evidenceChangedFromAncestors) {
    evidenceChangedFromAncestors = false;
    if (view === 'person' && byId[id]) build();
    else changeView();
  }
  if (v === 'tree' && view === 'person' && byId[id]) select(id, false);
  else if (v === 'tree' && sel && !narrow()) centre(sel);
}
window.addEventListener('hashchange', route);

let lastWidth = 0, lastWindowWidth = window.innerWidth;
if ('ResizeObserver' in window) new ResizeObserver(() => {
  if (!H || !scroller.clientWidth || lastWidth === scroller.clientWidth) return;
  lastWidth = scroller.clientWidth;
  if (lastWindowWidth !== window.innerWidth) {
    lastWindowWidth = window.innerWidth;
    build();
  } else setZoom(zoom);
  if (sel) centre(sel);
}).observe(scroller);

function start(){
  build();
  timeline();
  research();
  const [view, id] = location.hash.slice(1).split('/');
  if (view !== 'person' || !byId[id]) fitChart();
  route();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
window.addEventListener('load', () => {
  if (H && !$('#tree').hidden) {
    build();
    if (sel) {
      document.getElementById('c-' + sel)?.classList.add('sel');
      centre(sel);
    }
  }
});
})();
</script>
</body></html>
